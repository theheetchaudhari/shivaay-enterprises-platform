<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tab-logo.png" />
    <link rel="apple-touch-icon" href="/admin-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Shivaay Enterprises Admin Portal" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/admin-manifest.json" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shivaay Admin" />

    <title>Shivaay Enterprises — Admin Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/admin-sw.js', { scope: '/' })
            .catch((err) => console.log('Admin ServiceWorker registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
